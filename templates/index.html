<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baymax — Asistente médico</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <section id="chat-panel">
    <header class="panel-header">
      <div class="avatar">B</div>
      <div>
        <h1>Baymax</h1>
        <p>Asistente médico activo</p>
      </div>
    </header>

    <div id="mensajes"></div>

    <div id="botones-respuesta">
      <button onclick="responder('Sí')">Sí</button>
      <button onclick="responder('No')">No</button>
    </div>

  </section>

  <section id="graficas-panel">
    <nav class="tabs">
      <button class="tab active" data-tab="diagnostico">Diagnóstico</button>
      <button class="tab" data-tab="sintomas">Síntomas</button>
      
    </nav>

    <div class="tab-content active" id="tab-diagnostico">
      <h2>Diagnóstico orientativo</h2>
      <p id="diagnostico-texto">Responde las preguntas del chat para generar un resultado.</p>
      <img id="grafica-diagnosticos" style="display:none" alt="Gráfica de diagnósticos" />
      <img id="grafica-enfermedades" style="display:none" alt="Gráfica de enfermedades frecuentes" />
    </div>

    <div class="tab-content" id="tab-sintomas">
      <h2>Síntomas registrados</h2>
      <div class="chips" id="chips-sintomas"></div>

      <h3>Frecuencia estimada</h3>
      <div id="lista-frecuencias" class="frecuencias"></div>
      <img id="grafica-sintomas" style="display:none" alt="Gráfica de frecuencia de síntomas" />
    </div>

    
  </section>

  <script>
    let sessionId = null;
    let sintomaActual = null;
    const respuestasUsuario = {};

    window.onload = async () => {
      const res = await fetch('/iniciar', { method: 'POST' });
      const data = await res.json();
      sessionId = data.session_id;
      sintomaActual = data.sintoma;
      agregarMensaje('baymax', data.mensaje);
      agregarMensaje('baymax', data.pregunta);
      activarTabs();
      actualizarChips();
    };

    async function responder(valor) {
      agregarMensaje('usuario', valor);
      respuestasUsuario[sintomaActual] = valor;
      actualizarChips();

      const res = await fetch('/responder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          sintoma: sintomaActual,
          valor: valor
        })
      });

      const data = await res.json();
      agregarMensaje('baymax', data.mensaje);

      if (data.accion === 'pregunta') {
        sintomaActual = data.sintoma;
        agregarMensaje('baymax', data.pregunta);
      } else if (data.accion === 'diagnostico') {
        document.getElementById('diagnostico-texto').innerHTML = data.mensaje;
        llenarFrecuencias(data.candidatos || {});
        mostrarGrafica('grafica-diagnosticos', data.grafica_diag);
        mostrarGrafica('grafica-sintomas', data.grafica_sint);
        mostrarGrafica('grafica-enfermedades', data.grafica_enf);
        document.getElementById('botones-respuesta').style.display = 'none';
        document.getElementById('sugerencias').style.display = 'none';
        document.querySelector('.input-row').style.opacity = '0.6';
      }
    }

    function agregarMensaje(rol, texto) {
      const div = document.createElement('div');
      div.className = `mensaje ${rol}`;
      div.innerHTML = texto;
      const contenedor = document.getElementById('mensajes');
      contenedor.appendChild(div);
      contenedor.scrollTop = contenedor.scrollHeight;
    }

    function mostrarGrafica(id, base64) {
      const img = document.getElementById(id);
      img.src = 'data:image/png;base64,' + base64;
      img.style.display = 'block';
    }

    function activarTabs() {
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          tabs.forEach((btn) => btn.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach((content) => {
            content.classList.remove('active');
          });

          tab.classList.add('active');
          document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
        });
      });
    }

    function actualizarChips() {
      const chips = document.getElementById('chips-sintomas');
      chips.innerHTML = '';
      const activos = Object.entries(respuestasUsuario).filter(([, valor]) => valor === 'Sí');

      if (!activos.length) {
        chips.innerHTML = '<span class="chip">Aún sin síntomas confirmados</span>';
        return;
      }

      activos.forEach(([sintoma]) => {
        const span = document.createElement('span');
        span.className = 'chip';
        span.textContent = sintoma;
        chips.appendChild(span);
      });
    }

    function llenarFrecuencias(candidatos) {
      const lista = document.getElementById('lista-frecuencias');
      lista.innerHTML = '';

      Object.entries(candidatos).forEach(([nombre, valor]) => {
        const fila = document.createElement('div');
        fila.className = 'fila-frecuencia';
        fila.innerHTML = `
          <span>${nombre}</span>
          <div class="barra"><div style="width:${valor}%"></div></div>
          <strong>${valor}%</strong>
        `;
        lista.appendChild(fila);
      });
    }

  </script>
</body>
</html>
